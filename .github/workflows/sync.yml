name: Sync Repository to Google Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-to-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Upload Files via Apps Script Gateway
        env:
          WEBAPP_URL: ${{ secrets.GDRIVE_WEBAPP_URL }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests

          webapp_url = os.environ.get('WEBAPP_URL', '').strip()
          folder_id = os.environ.get('FOLDER_ID', '').strip()

          if not webapp_url or not folder_id:
              raise ValueError("Missing GDRIVE_WEBAPP_URL or GDRIVE_FOLDER_ID")

          print("Connected to Google Apps Script Gateway...")

          count = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for file in files:
                  file_path = os.path.join(root, file)
                  file_name = os.path.relpath(file_path, '.').replace(os.path.sep, '_')

                  try:
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                  except Exception:
                      continue

                  payload = {
                      "secret": "RISE_MITRA_SYNC_2026",
                      "folderId": folder_id,
                      "fileName": file_name,
                      "content": content
                  }

                  res = requests.post(webapp_url, json=payload, allow_redirects=True)
                  if res.status_code == 200 and res.json().get('status') == 'success':
                      print(f"Synced: {file_name}")
                      count += 1
                  else:
                      print(f"Failed {file_name}: {res.text}")

          print(f"\nALL DONE: {count} files synchronized to Google Drive successfully!")
          EOF
