name: Run E2E Governance & Integration Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  governance-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Execute E2E Governance Verification Suite
        run: |
          npm test
